name: Base de datos

# Aplica supabase/*.sql sobre un Supabase local, en el mismo orden que Diego los pega,
# y exige que verificacion.sql diga «ok» en todas las filas. Después prueba la RLS de la
# etapa 3 con la API como la usa el navegador (pruebas/base/rls.mjs).
on:
  pull_request:
    paths: ["supabase/**", "pruebas/base/**", ".github/workflows/base-de-datos.yml", "package-lock.json"]
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          supabase init --force
          # Segundo factor TOTP para el equipo (plataforma 5.1 y 9.7), como en el proyecto real.
          python3 - <<'PY'
          import re
          p = "supabase/config.toml"
          s = open(p).read()
          bloque = "[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true\n"
          if re.search(r"^\[auth\.mfa\.totp\]", s, re.M):
              s = re.sub(r"^\[auth\.mfa\.totp\]\n(?:[^\[\n].*\n|\n)*?(?=^\[|\Z)", bloque + "\n", s, flags=re.M)
          else:
              s += "\n" + bloque
          open(p, "w").write(s)
          PY
          grep -A2 '^\[auth.mfa.totp\]' supabase/config.toml
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor,mailpit
      - name: Aplicar el SQL en orden
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for f in 00-esquema 01-funciones 02-rls 03-storage 04-auth 05-avisos 06-cron semillas feriados-2026-2027 07-etapa3; do
            echo "::group::$f.sql"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "supabase/$f.sql"
            echo "::endgroup::"
          done
      - name: Verificación
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -F ' | ' -f supabase/verificacion.sql | tee verificacion.txt
          if grep -v '| ok$' verificacion.txt; then echo "::error::verificacion.sql tiene filas que no dicen ok"; exit 1; fi
      # Humo de la API tal como la usa el navegador (plataforma 6.6): PostgREST con la clave anon.
      # Envía una solicitud válida, la lee con el mismo token y comprueba que la tabla no se lee
      # directo. La clave sale de `supabase status`; nunca se usa una clave de servicio.
      - name: Humo de la API
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$PGURL" -q -c "notify pgrst, 'reload schema'"
          eval "$(cd "$RUNNER_TEMP/sb" && supabase status -o env)"
          CLAVE="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [ -z "$CLAVE" ]; then echo "::error::supabase status no entregó la clave anon"; exit 1; fi
          API="http://127.0.0.1:54321"
          CABECERAS=(-H "apikey: $CLAVE" -H "Content-Type: application/json")
          # La clave anon antigua es un JWT y va también como Bearer (como en src/lib/api.ts).
          case "$CLAVE" in eyJ*) CABECERAS+=(-H "Authorization: Bearer $CLAVE") ;; esac
          rpc() { curl -sS --fail-with-body -X POST "${CABECERAS[@]}" -d "$2" "$API/rest/v1/rpc/$1"; }

          # PostgREST recarga el esquema en segundo plano: se espera a que responda la RPC.
          for i in $(seq 1 30); do
            if rpc estado_postulaciones '{}' > /dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "::error::PostgREST no responde estado_postulaciones"; exit 1; fi
            sleep 2
          done

          # Token como el del navegador: 32 bytes en base64url, 43 caracteres.
          TOKEN=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          if [ "${#TOKEN}" != 43 ]; then echo "::error::token de ${#TOKEN} caracteres"; exit 1; fi
          CUERPO=$(jq -n --arg t "$TOKEN" '{p: {
            token: $t, tipo: "solicitud", nombre: "Prueba CI", correo: "prueba-ci@example.com",
            area: "proyectos", meta: "Quiero ordenar mis semanas para terminar mi proyecto.", apoyo: "coach",
            dias: ["lun"], franjas: ["tarde"], horarios_nota: null, zona_horaria: "America/Santiago",
            mayor_edad: true, autorizacion: true, texto_autorizacion: "Autorizo (prueba de CI).",
            avisos_futuros: false, origen: null, ms: 5000, campo_extra_7: ""}}')
          echo "::group::enviar_solicitud"
          ENVIO=$(rpc enviar_solicitud "$CUERPO") || { echo "::error::enviar_solicitud falló: $ENVIO"; exit 1; }
          echo "$ENVIO" | jq -e '.tipo == "solicitud"'
          # Reintento con el mismo token: misma respuesta, sin duplicar.
          rpc enviar_solicitud "$CUERPO" | jq -e '.tipo == "solicitud"'
          echo "::endgroup::"

          echo "::group::ver_solicitud"
          VISTA=$(rpc ver_solicitud "$(jq -n --arg t "$TOKEN" '{p_token: $t}')") || { echo "::error::ver_solicitud falló: $VISTA"; exit 1; }
          echo "$VISTA" | jq '{tipo, estado}'
          if ! echo "$VISTA" | jq -e '.estado == "recibida"' > /dev/null; then
            echo "::error::ver_solicitud no devolvió el estado de la solicitud"; exit 1
          fi
          echo "::endgroup::"

          # La tabla no se lee con la clave anon: 401, 403 o ninguna fila.
          CODIGO=$(curl -sS -o filas.json -w '%{http_code}' "${CABECERAS[@]}" "$API/rest/v1/solicitudes?select=*")
          case "$CODIGO" in
            401|403) echo "solicitudes: $CODIGO (sin acceso)" ;;
            200) if ! jq -e 'length == 0' filas.json > /dev/null; then
                   echo "::error::la clave anon lee filas de solicitudes"; exit 1
                 fi; echo "solicitudes: 200 sin filas" ;;
            *) echo "::error::GET solicitudes respondió $CODIGO"; cat filas.json; exit 1 ;;
          esac

      # Etapa 3: RLS de Mi espacio y del panel con cuentas reales de la base local (nunca la clave
      # de servicio): la persona ve solo su programa publicado, nunca borradores; otra persona no
      # ve nada; el equipo administra solo con segundo factor (aal2).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: RLS de la etapa 3
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          eval "$(cd "$RUNNER_TEMP/sb" && supabase status -o env)"
          export API_URL="${API_URL:-http://127.0.0.1:54321}"
          export ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          node pruebas/base/rls.mjs
