name: Base de datos

# Aplica supabase/migrations/ en orden sobre un Supabase local, como Diego los pega en el SQL
# Editor, y exige que verificacion.sql diga «ok» en todas las filas. Luego compara esa base con
# las migraciones usando la herramienta oficial (`supabase db diff`), prueba la API y la RLS
# (pruebas/base/rls.mjs) y, al final, comprueba que las dos revisiones detectan cambios.
on:
  pull_request:
    paths: ["supabase/**", "pruebas/base/**", ".github/workflows/base-de-datos.yml", "package-lock.json"]
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          supabase init --force
          # Segundo factor TOTP para el equipo (plataforma 5.1 y 9.7), como en el proyecto real.
          python3 - <<'PY'
          import re
          p = "supabase/config.toml"
          s = open(p).read()
          bloque = "[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true\n"
          if re.search(r"^\[auth\.mfa\.totp\]", s, re.M):
              s = re.sub(r"^\[auth\.mfa\.totp\]\n(?:[^\[\n].*\n|\n)*?(?=^\[|\Z)", bloque + "\n", s, flags=re.M)
          else:
              s += "\n" + bloque
          open(p, "w").write(s)
          PY
          grep -A2 '^\[auth.mfa.totp\]' supabase/config.toml
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor,mailpit
      - name: Aplicar el SQL en orden
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: Verificación
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -At -F ' | ' -f supabase/verificacion.sql | tee verificacion.txt
          if grep -v '| ok$' verificacion.txt; then echo "::error::verificacion.sql tiene filas que no dicen ok"; exit 1; fi
      # Etapa 1: la herramienta oficial arma una base aparte desde supabase/migrations/ y la compara
      # con la base de arriba (pegada como en producción). Debe salir vacía: si no, el repositorio y
      # la forma de aplicar no coinciden. Es el mismo comando que Diego corre contra producción
      # (docs/migraciones.md). Solo public y privado: storage, auth y cron los cubre verificacion.sql.
      - name: Comparar con supabase db diff
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          supabase --version
          supabase db diff --db-url "$PGURL" -s public,privado --output-format json > diff.json 2> diff.err \
            || { cat diff.json diff.err; echo "::error::supabase db diff no pudo ejecutarse"; exit 1; }
          jq -r '"motor: " + .engine' diff.json
          if [ -n "$(jq -r '.diff' diff.json | tr -d '[:space:]')" ]; then
            jq -r '.diff' diff.json; echo "::error::supabase db diff encontró diferencias"; exit 1
          fi
          echo "sin diferencias"
      # Humo de la API tal como la usa el navegador (plataforma 6.6): PostgREST con la clave anon.
      # Envía una solicitud válida, la lee con el mismo token y comprueba que la tabla no se lee
      # directo. La clave sale de `supabase status`; nunca se usa una clave de servicio.
      - name: Humo de la API
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$PGURL" -q -c "notify pgrst, 'reload schema'"
          eval "$(cd "$RUNNER_TEMP/sb" && supabase status -o env)"
          CLAVE="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [ -z "$CLAVE" ]; then echo "::error::supabase status no entregó la clave anon"; exit 1; fi
          API="http://127.0.0.1:54321"
          CABECERAS=(-H "apikey: $CLAVE" -H "Content-Type: application/json")
          # La clave anon antigua es un JWT y va también como Bearer (como en src/lib/api.ts).
          case "$CLAVE" in eyJ*) CABECERAS+=(-H "Authorization: Bearer $CLAVE") ;; esac
          rpc() { curl -sS --fail-with-body -X POST "${CABECERAS[@]}" -d "$2" "$API/rest/v1/rpc/$1"; }

          # PostgREST recarga el esquema en segundo plano: se espera a que responda la RPC.
          for i in $(seq 1 30); do
            if rpc estado_postulaciones '{}' > /dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "::error::PostgREST no responde estado_postulaciones"; exit 1; fi
            sleep 2
          done

          # Token como el del navegador: 32 bytes en base64url, 43 caracteres.
          TOKEN=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          if [ "${#TOKEN}" != 43 ]; then echo "::error::token de ${#TOKEN} caracteres"; exit 1; fi
          CUERPO=$(jq -n --arg t "$TOKEN" '{p: {
            token: $t, tipo: "solicitud", nombre: "Prueba CI", correo: "prueba-ci@example.com",
            area: "proyectos", meta: "Quiero ordenar mis semanas para terminar mi proyecto.", apoyo: "coach",
            dias: ["lun"], franjas: ["tarde"], horarios_nota: null, zona_horaria: "America/Santiago",
            mayor_edad: true, autorizacion: true, texto_autorizacion: "Autorizo (prueba de CI).",
            avisos_futuros: false, origen: null, ms: 5000, campo_extra_7: ""}}')
          echo "::group::enviar_solicitud"
          ENVIO=$(rpc enviar_solicitud "$CUERPO") || { echo "::error::enviar_solicitud falló: $ENVIO"; exit 1; }
          echo "$ENVIO" | jq -e '.tipo == "solicitud"'
          # Reintento con el mismo token: misma respuesta, sin duplicar.
          rpc enviar_solicitud "$CUERPO" | jq -e '.tipo == "solicitud"'
          echo "::endgroup::"

          echo "::group::ver_solicitud"
          VISTA=$(rpc ver_solicitud "$(jq -n --arg t "$TOKEN" '{p_token: $t}')") || { echo "::error::ver_solicitud falló: $VISTA"; exit 1; }
          echo "$VISTA" | jq '{tipo, estado}'
          if ! echo "$VISTA" | jq -e '.estado == "recibida"' > /dev/null; then
            echo "::error::ver_solicitud no devolvió el estado de la solicitud"; exit 1
          fi
          echo "::endgroup::"

          # Formulario de contacto (/contacto/): enviar_mensaje guarda el mensaje. Con motivo
          # «datos» también abre una petición de derechos (migrations/20261021000000_arreglo_aviso_contacto.sql).
          echo "::group::enviar_mensaje"
          rpc enviar_mensaje '{"p":{"motivo":"datos","nombre":"Contacto CI","correo":"contacto-ci@example.com","mensaje":"Mensaje de prueba de CI.","ms":5000,"campo_extra_7":""}}' | tee mensaje.json
          jq -e '.ok == true' mensaje.json > /dev/null || { echo "::error::enviar_mensaje no guardó el mensaje"; exit 1; }
          [ "$(psql "$PGURL" -At -c "select count(*) from public.mensajes_contacto where correo = 'contacto-ci@example.com'")" = 1 ] \
            || { echo "::error::el mensaje de contacto no quedó en la base"; exit 1; }
          [ "$(psql "$PGURL" -At -c "select count(*) from public.peticiones_derechos where correo = 'contacto-ci@example.com'")" = 1 ] \
            || { echo "::error::el motivo «datos» no abrió la petición de derechos"; exit 1; }
          echo "::endgroup::"

          # La tabla no se lee con la clave anon: 401, 403 o ninguna fila.
          CODIGO=$(curl -sS -o filas.json -w '%{http_code}' "${CABECERAS[@]}" "$API/rest/v1/solicitudes?select=*")
          case "$CODIGO" in
            401|403) echo "solicitudes: $CODIGO (sin acceso)" ;;
            200) if ! jq -e 'length == 0' filas.json > /dev/null; then
                   echo "::error::la clave anon lee filas de solicitudes"; exit 1
                 fi; echo "solicitudes: 200 sin filas" ;;
            *) echo "::error::GET solicitudes respondió $CODIGO"; cat filas.json; exit 1 ;;
          esac

      # Etapa 3: RLS de Mi espacio y del panel con cuentas reales de la base local (nunca la clave
      # de servicio): la persona ve solo su programa publicado, nunca borradores; otra persona no
      # ve nada; el equipo administra solo con segundo factor (aal2).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: RLS de la etapa 3
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          eval "$(cd "$RUNNER_TEMP/sb" && supabase status -o env)"
          export API_URL="${API_URL:-http://127.0.0.1:54321}"
          export ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          node pruebas/base/rls.mjs

      # Etapa 1: las dos revisiones deben detectar cambios hechos a mano. Va al final porque altera
      # la base local de prueba (nunca producción).
      - name: Las revisiones detectan cambios
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -q <<'SQL'
          grant select on public.solicitudes to anon;
          create index prueba_ci on public.areas (nombre);
          create or replace function privado.tareas_por_hora() returns void
            language plpgsql security definer set search_path = '' as $$ begin null; end $$;
          select cron.alter_job((select jobid from cron.job where jobname = 'rumbo-por-hora'), schedule := '6 * * * *');
          alter policy evid_ver on storage.objects using (true);
          insert into storage.buckets (id, name) values ('prueba-ci', 'prueba-ci');
          drop trigger al_crear_usuario on auth.users;
          SQL
          supabase db diff --db-url "$PGURL" -s public,privado --output-format json | jq -r '.diff' > diff.sql
          for buscado in 'GRANT SELECT ON TABLE "public"."solicitudes" TO "anon"' 'prueba_ci' 'privado.tareas_por_hora'; do
            grep -qF "$buscado" diff.sql || { cat diff.sql; echo "::error::db diff no detectó: $buscado"; exit 1; }
          done
          psql "$PGURL" -At -F ' | ' -f supabase/verificacion.sql > verificacion.txt
          FALLAS=$(grep -c '^etapa 1: .* | FALLA' verificacion.txt || true)
          cat verificacion.txt
          if [ "$FALLAS" != 4 ]; then echo "::error::verificacion.sql detectó $FALLAS de 4 cambios"; exit 1; fi
          echo "las dos revisiones detectaron todos los cambios"
