name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Con dominio propio, definir en Settings → Secrets and variables → Actions → Variables:
  # BASE_PATH=/ y SITE_URL=https://tudominio.cl
  BASE_PATH: ${{ vars.BASE_PATH || '/rumbo-web/' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://diegolazo84.github.io/rumbo-web' }}

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run check
      - name: Compilar y prerenderizar
        run: npm run build
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Prueba de humo, enlaces, reenvíos y accesibilidad
        run: npm test
      - name: Guardar evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-pruebas
          path: test-results/
          retention-days: 7
      - name: Empaquetar para Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # Una publicación a la vez; no se cancela una que ya está en curso.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  comprobar-produccion:
    needs: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas @produccion contra el sitio publicado
        env:
          URL_PRUEBA: ${{ vars.SITE_URL || 'https://diegolazo84.github.io/rumbo-web' }}
        run: npm test
